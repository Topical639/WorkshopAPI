<!DOCTYPE html>
<html lang="en">


<head>
       
    <meta charset="UTF-8">
       
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>POST CORS Test</title>
</head>


<body>
        <h1>POST CORS Test</h1>
        <button onclick="testPostCORS()">Test POST CORS</button>
        <p id="result"></p>
    
       
    <script>
        function testPostCORS() {
            fetch("https://localhost:5001/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ username: "loginName", password: "Ab@cdefGH" })
            })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').textContent = JSON.stringify(data);
                })
                .catch(error => {
                    document.getElementById('result').textContent = 'Error: ' + error;
                });
        }
    </script>
</body>


</html>
